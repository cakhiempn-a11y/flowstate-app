<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="FlowState">
  <!-- Tiny ears/bells on top for cuteness -->
  <path d="M25 25 Q30 8 42 16" stroke="#e86fa5" fill="#e86fa5" fill-opacity="0.2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M75 25 Q70 8 58 16" stroke="#e86fa5" fill="#e86fa5" fill-opacity="0.2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Clock Face Container -->
  <circle cx="50" cy="55" r="40" fill="#ffffff" stroke="#e86fa5" stroke-width="6" />
  
  <!-- Cute Eyes -->
  <circle cx="37" cy="48" r="4.5" fill="#333333" />
  <circle cx="63" cy="48" r="4.5" fill="#333333" />
  
  <!-- Sparkle inside eyes (kawaii detail) -->
  <circle cx="38.5" cy="46.5" r="1.5" fill="#ffffff" />
  <circle cx="64.5" cy="46.5" r="1.5" fill="#ffffff" />
  
  <!-- Cute Blush -->
  <circle cx="28" cy="54" r="4" fill="#e86fa5" opacity="0.3" />
  <circle cx="72" cy="54" r="4" fill="#e86fa5" opacity="0.3" />
  
  <!-- Small friendly smile -->
  <path d="M44 56 Q50 62 56 56" stroke="#333333" stroke-width="3.5" stroke-linecap="round" fill="none" />
  
  <!-- Simple clock hands - playful positions -->
  <path d="M50 55 L50 34" stroke="#333333" stroke-width="4.5" stroke-linecap="round" />
  <path d="M50 55 L65 65" stroke="#333333" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Center dot -->
  <circle cx="50" cy="55" r="4.5" fill="#e86fa5" />
</svg>
