<!doctype html>
<html lang="en">
  <head>
<script>
  window.addEventListener('error', function(e) {
    document.body.innerHTML = '<div style="color:red;padding:20px;z-index:9999;position:fixed;top:0;left:0;background:white;width:100%;">' + e.error.stack + '</div>';
  });
</script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e86fa5" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js?v=2').then(reg => {
            console.log('ServiceWorker registered:', reg.scope);
          }).catch(err => {
            console.error('ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
    <title>My Google AI Studio App</title>
    <meta name="description" content="An application built with Google AI Studio." />
    <meta property="og:title" content="My Google AI Studio App" />
    <meta property="og:description" content="An application built with Google AI Studio." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  
    

  
    <script>
      // Capture early
      window.promptFired = false;
      window.appInstalled = false;
      window.addEventListener('beforeinstallprompt', (e) => {
        window.promptFired = true;
        window.deferredPrompt = e;
      });
      window.addEventListener('appinstalled', (e) => {
        window.appInstalled = true;
      });

      window.addEventListener('load', () => {
        const diag = document.createElement('div');
        diag.style.position = 'fixed';
        diag.style.bottom = '10px';
        diag.style.right = '10px';
        diag.style.background = 'rgba(0,0,0,0.8)';
        diag.style.color = 'lime';
        diag.style.padding = '10px';
        diag.style.zIndex = '99999';
        diag.style.fontSize = '10px';
        diag.style.pointerEvents = 'none';
        document.body.appendChild(diag);
        
        const updateDiag = () => {
          const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
          const modes = ['fullscreen', 'standalone', 'minimal-ui', 'browser'];
          const currentMode = modes.find(mode => window.matchMedia(`(display-mode: ${mode})`).matches) || 'unknown';
          
          let swState = 'none';
          if (navigator.serviceWorker && navigator.serviceWorker.controller) {
            swState = 'controlled';
          }
          
          diag.innerHTML = `
            <strong>PWA Diagnostics v2</strong><br/>
            standalone: ${isStandalone}<br/>
            display-mode: ${currentMode}<br/>
            prompt-fired: ${window.promptFired}<br/>
            app-installed: ${window.appInstalled}<br/>
            sw: ${swState}<br/>
            url: ${window.location.pathname}
          `;
        };
        
        setInterval(updateDiag, 1000);
        updateDiag();
      });
    </script>

  </body>
</html>
